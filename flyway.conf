# Flyway Configuration
# 資料庫遷移版本控制系統設定檔

# ================================================================================
# 資料庫連線設定
# ================================================================================
# 可透過環境變數覆蓋: FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD
flyway.url=jdbc:postgresql://localhost:5432/maplay
flyway.user=postgres
flyway.password=postgres

# ================================================================================
# 遷移檔案位置
# ================================================================================
# 預設從 db/migration 目錄讀取版本化 SQL 遷移檔案
flyway.locations=filesystem:db/migration

# ================================================================================
# 遷移行為設定
# ================================================================================
# 啟用遷移執行時驗證 (確保已安裝版本與遷移檔案一致)
flyway.validate-on-migrate=true

# 對已有資料的資料庫建立基線版本 (允許從中間版本開始)
flyway.baseline-on-migrate=true

# 基線版本設定 (如果需要從特定版本開始)
flyway.baselineVersion=0

# ================================================================================
# 遷移執行設定
# ================================================================================
# 遷移時自動連線至資料庫執行 (非 dry-run)
flyway.clean-on-validation-error=false

# 失敗時不自動清理 (保留錯誤狀態供診斷)
flyway.clean-disabled=true

# 允許同一版本重複執行時的檢查策略
flyway.out-of-order=false

# ================================================================================
# SQL 腳本設定
# ================================================================================
# SQL 遷移檔案編碼
flyway.encoding=UTF-8

# SQL 腳本分隔符號
flyway.sqlMigrationSeparator=__

# SQL 腕本副檔名
flyway.sqlMigrationSuffixes=.sql

# 可重複執行的遷移檔案前綴
flyway.repeatableMigrationPrefix=R

# ================================================================================
# 驗證與報告
# ================================================================================
# 顯示詳細執行資訊
flyway.verbose=false

# 記錄警告資訊
flyway.ignoreWarnings=false